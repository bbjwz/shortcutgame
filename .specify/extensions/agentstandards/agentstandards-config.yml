schema_version: '1.0'
configured: true
participants:
- id: codex
  required: true
  enabled: true
  transport: codex-cli
  underlying_vendor: openai
  model: gpt-6.1-sol
  executable: codex
  max_output_tokens: 12000
  pricing:
    input_per_million_usd: 0.0
    output_per_million_usd: 0.0
- id: anthropic
  required: true
  enabled: true
  transport: anthropic
  underlying_vendor: anthropic
  model: claude-opus-5-5
  api_key_env: ABACUS_API_KEY
  base_url: https://routellm.abacus.ai
  max_output_tokens: 12000
  pricing:
    input_per_million_usd: 0.0
    output_per_million_usd: 0.0
limits:
  max_concurrency: 4
  request_timeout_seconds: 180
  max_retries: 2
  max_calls_per_run: 500
  max_total_input_tokens: 2000000
  max_total_output_tokens: 500000
  max_cost_usd: 100.0
transcripts:
  commit_visible_io: true
  include_response_envelope: false
  secret_scan: true
  redaction_policy: abort
isolation:
  context_mode: fresh-context-per-invocation
  reuse_provider_sessions: false
  reuse_adapter_instances: false
